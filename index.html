<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anchor OS</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22AnchorOS%22,%22short_name%22:%22Anchor%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%23121212%22}">
  <style>
    :root {
      --bg: #121212;
      --surface: #1E1E1E;
      --surface-elevated: #282828;
      --text: #E0E0E0;
      --text-muted: #888888;
      --accent: #3B82F6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --danger: #EF4444;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; }

    /* Layout Shell */
    .app-container { max-width: 1100px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--surface-elevated); }
    h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }

    /* Controls & Buttons */
    button {
      background: var(--surface); color: var(--text); border: 1px solid var(--surface-elevated);
      padding: 0.75rem 1rem; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background 0.15s ease;
    }
    button:active { filter: brightness(1.2); }
    .btn-accent { background: var(--accent); color: white; border: none; font-weight: 600; }
    .btn-emergency { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

    /* Morning Coffee / Bandwidth Selector */
    .bandwidth-bar { display: flex; gap: 0.5rem; }
    .bandwidth-btn { flex: 1; padding: 0.5rem; font-size: 0.8rem; border-radius: 8px; }
    .bandwidth-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Spatial Diary Columns */
    .grid-view { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 768px) {
      .grid-view { grid-template-columns: repeat(3, 1fr); }
    }

    .column { background: var(--surface); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; min-height: 300px; }
    .column-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* Action Cards */
    .action-card {
      background: var(--surface-elevated); border-radius: 8px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem; border-left: 4px solid var(--accent);
      touch-action: pan-y;
    }
    .action-title { font-size: 1rem; line-height: 1.4; }
    .metadata-line { display: flex; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted); align-items: center; }
    .badge { background: var(--bg); padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--surface-elevated); }

    /* Capture Dock */
    .capture-dock {
      position: sticky; bottom: 1rem; background: var(--surface);
      border: 1px solid var(--surface-elevated); border-radius: var(--radius);
      padding: 0.5rem; display: flex; gap: 0.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .capture-input {
      flex: 1; background: transparent; border: none; padding: 0.5rem 0.75rem;
      color: var(--text); font-size: 1rem; outline: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Anchor OS</h1>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn-emergency" onclick="App.triggerEmergencyReset()">🆘 Reset</button>
      <button onclick="App.showSettings()">⚙️</button>
    </div>
  </header>

  <!-- Bandwidth Selector -->
  <div class="bandwidth-bar">
    <button class="bandwidth-btn active" onclick="App.setBandwidth('Full Day', this)">⚡ Full Day</button>
    <button class="bandwidth-btn" onclick="App.setBandwidth('Squeezed', this)">⏳ Squeezed</button>
    <button class="bandwidth-btn" onclick="App.setBandwidth('Low Bandwidth', this)">🔋 Low</button>
  </div>

  <!-- Diary Workspace Layout -->
  <main class="grid-view">
    <section class="column" id="col-work">
      <div class="column-header">
        <span>Work (WIP: 2)</span>
        <span id="count-work">0/2</span>
      </div>
      <div class="cards-container" id="cards-work"></div>
    </section>

    <section class="column" id="col-growth">
      <div class="column-header">
        <span>Growth (WIP: 1)</span>
        <span id="count-growth">0/1</span>
      </div>
      <div class="cards-container" id="cards-growth"></div>
    </section>

    <section class="column" id="col-health">
      <div class="column-header">
        <span>Health (WIP: 1)</span>
        <span id="count-health">0/1</span>
      </div>
      <div class="cards-container" id="cards-health"></div>
    </section>
  </main>

  <!-- Ambient Capture Form -->
  <div class="capture-dock">
    <button id="btn-mic" onclick="App.toggleSpeech()">🎙️</button>
    <input type="text" id="raw-input" class="capture-input" placeholder="Ambient dump... (Enter to process)" onkeydown="if(event.key==='Enter') App.processAmbientDump()">
    <button class="btn-accent" onclick="App.processAmbientDump()">Parse</button>
  </div>
</div>

<script>
/**
 * Zero-Dependency Native IndexedDB Engine
 */
class DB {
  constructor(dbName = "AnchorDB", version = 1) {
    this.name = dbName;
    this.v = version;
    this.instance = null;
  }
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.v);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("actions")) {
          db.createObjectStore("actions", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("state")) {
          db.createObjectStore("state", { keyPath: "key" });
        }
      };
      req.onsuccess = () => { this.instance = req.result; resolve(this); };
      req.onerror = () => reject(req.error);
    });
  }
  async get(store, key) {
    return new Promise((res, rej) => {
      const tx = this.instance.transaction(store, "readonly");
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => res(req.result?.value ?? req.result);
      req.onerror = () => rej(tx.error);
    });
  }
  async getAll(store) {
    return new Promise((res, rej) => {
      const tx = this.instance.transaction(store, "readonly");
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(tx.error);
    });
  }
  async set(store, val) {
    return new Promise((res, rej) => {
      const tx = this.instance.transaction(store, "readwrite");
      tx.objectStore(store).put(val);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  async delete(store, key) {
    return new Promise((res, rej) => {
      const tx = this.instance.transaction(store, "readwrite");
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
}

/**
 * Main Application Orchestrator
 */
class Controller {
  constructor() {
    this.db = new DB();
    this.apiKey = localStorage.getItem("GEMINI_KEY") || "";
    this.WIP_LIMITS = { "Work": 2, "Personal Growth": 1, "Health": 1 };
    this.recognition = null;
  }

  async start() {
    await this.db.init();
    if ("storage" in navigator && "persist" in navigator.storage) {
      await navigator.storage.persist();
    }
    this.bindEvents();
    await this.verifyMidnightReset();
    await this.render();
  }

  bindEvents() {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") this.verifyMidnightReset();
    });
  }

  async verifyMidnightReset() {
    const today = new Date().toISOString().split("T")[0];
    const lastSession = await this.db.get("state", "last_session_date");
    if (lastSession !== today) {
      // Execute Neutral Midnight Flush: Reset slots without penalization
      await this.db.set("state", { key: "last_session_date", value: today });
      await this.db.set("state", { key: "bandwidth", value: "Full Day" });
      await this.render();
    }
  }

  async setBandwidth(mode, btn) {
    document.querySelectorAll(".bandwidth-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    await this.db.set("state", { key: "bandwidth", value: mode });
    this.render();
  }

  showSettings() {
    const key = prompt("Enter Google AI Studio API Key:", this.apiKey);
    if (key !== null) {
      this.apiKey = key.trim();
      localStorage.setItem("GEMINI_KEY", this.apiKey);
    }
  }

  toggleSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Speech recognition not supported on this device.");

    if (this.recognition) {
      this.recognition.stop();
      this.recognition = null;
      document.getElementById("btn-mic").innerText = "🎙️";
      return;
    }

    this.recognition = new SpeechRecognition();
    this.recognition.continuous = false;
    this.recognition.interimResults = false;
    this.recognition.onstart = () => { document.getElementById("btn-mic").innerText = "🛑"; };
    this.recognition.onresult = (e) => {
      document.getElementById("raw-input").value = e.results[0][0].transcript;
      this.processAmbientDump();
    };
    this.recognition.onerror = () => { this.recognition = null; document.getElementById("btn-mic").innerText = "🎙️"; };
    this.recognition.onend = () => { this.recognition = null; document.getElementById("btn-mic").innerText = "🎙️"; };
    this.recognition.start();
  }

  async processAmbientDump() {
    const field = document.getElementById("raw-input");
    const rawText = field.value.trim();
    if (!rawText) return;

    if (!this.apiKey) {
      this.showSettings();
      if (!this.apiKey) return;
    }

    field.value = "Parsing intent...";
    field.disabled = true;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Deconstruct this input into physical starters according to your schema rules: "${rawText}"`
            }]
          }],
          generationConfig: {
            response_mime_type: "application/json",
            response_schema: {
              type: "OBJECT",
              properties: {
                parsed_actions: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      title: { "type": "STRING" },
                      domain: { "type": "STRING", "enum": ["Work", "Personal Growth", "Health"] },
                      batch_type: { "type": "STRING", "enum": ["None", "Calls & Messages", "Quick Admin", "Errands & Shopping"] },
                      estimated_mins: { "type": "INTEGER" }
                    },
                    required: ["title", "domain", "batch_type", "estimated_mins"]
                  }
                }
              },
              required: ["parsed_actions"]
            }
          }
        })
      });

      const data = await response.json();
      const output = JSON.parse(data.candidates[0].content.parts[0].text);

      for (const item of output.parsed_actions) {
        await this.db.set("actions", {
          id: "act_" + crypto.randomUUID(),
          title: item.title,
          domain: item.domain,
          batch_type: item.batch_type,
          estimated_mins: item.estimated_mins || 10,
          is_completed: false,
          defer_count: 0,
          created_at: new Date().toISOString()
        });
      }

      field.value = "";
    } catch (err) {
      alert("Extraction failed: " + err.message);
      field.value = rawText;
    } finally {
      field.disabled = false;
      await this.render();
    }
  }

  async completeAction(id) {
    const action = await this.db.get("actions", id);
    if (!action) return;
    action.is_completed = true;
    await this.db.set("actions", action);
    await this.render();
  }

  async triggerEmergencyReset() {
    const actions = await this.db.getAll("actions");
    const active = actions.filter(a => !a.is_completed);
    for (const a of active) {
      a.defer_count = (a.defer_count || 0) + 1;
      await this.db.set("actions", a);
    }
    // Demote everything cleanly to pool, zero visual friction
    await this.render();
  }

  async shrinkStep(id) {
    if (!this.apiKey) { this.showSettings(); return; }
    const action = await this.db.get("actions", id);
    if (!action) return;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Make this task significantly smaller. Break it down to an absurdly simple, low-friction micro-step that takes under 2 minutes to start: "${action.title}"`
            }]
          }],
          generationConfig: {
            response_mime_type: "application/json",
            response_schema: {
              type: "OBJECT",
              properties: { "micro_step": { "type": "STRING" } },
              required: ["micro_step"]
            }
          }
        })
      });
      const data = await response.json();
      const res = JSON.parse(data.candidates[0].content.parts[0].text);
      action.title = res.micro_step;
      action.estimated_mins = 2;
      await this.db.set("actions", action);
      await this.render();
    } catch (e) {
      alert("Failed to slice step: " + e.message);
    }
  }

  async render() {
    const actions = await this.db.getAll("actions");
    const incomplete = actions.filter(a => !a.is_completed);

    const domains = ["Work", "Personal Growth", "Health"];
    const containers = {
      "Work": document.getElementById("cards-work"),
      "Personal Growth": document.getElementById("cards-growth"),
      "Health": document.getElementById("cards-health")
    };
    const counters = {
      "Work": document.getElementById("count-work"),
      "Personal Growth": document.getElementById("count-growth"),
      "Health": document.getElementById("count-health")
    };

    domains.forEach(d => {
      containers[d].innerHTML = "";
      const domainActions = incomplete.filter(a => a.domain === d);
      const limit = this.WIP_LIMITS[d];
      counters[d].innerText = `${Math.min(domainActions.length, limit)}/${limit}`;

      // Only slice to WIP Limit (Hide excess items safely in background)
      domainActions.slice(0, limit).forEach(act => {
        const bufferedTime = Math.round(act.estimated_mins * 1.5);
        const card = document.createElement("div");
        card.className = "action-card";
        card.innerHTML = `
          <div class="action-title">${act.title}</div>
          <div class="metadata-line">
            <span class="badge">⏱️ ${act.estimated_mins}m (Buf: ${bufferedTime}m)</span>
            ${act.batch_type !== "None" ? `<span class="badge">🏷️ ${act.batch_type}</span>` : ""}
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button class="btn-accent" style="flex:1;" onclick="App.completeAction('${act.id}')">✓ Done</button>
            <button style="padding: 0.5rem;" title="Micro-slice this task" onclick="App.shrinkStep('${act.id}')">✂️</button>
          </div>
        `;
        containers[d].appendChild(card);
      });
    });
  }
}

const App = new Controller();
window.addEventListener("DOMContentLoaded", () => App.start());
</script>
</body>
</html>
