<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anchor OS</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #121212;
      --surface: #1E1E1E;
      --surface-elevated: #262626;
      --text: #E0E0E0;
      --text-muted: #888888;
      --accent: #3B82F6;
      --accent-hard: #F59E0B;
      --danger: #EF4444;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding-bottom: 5rem; }

    .app-container { max-width: 1000px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid var(--surface-elevated); }
    h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }

    button {
      background: var(--surface); color: var(--text); border: 1px solid var(--surface-elevated);
      padding: 0.65rem 1rem; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    }
    button:active { filter: brightness(1.2); }
    .btn-accent { background: var(--accent); color: white; border: none; font-weight: 600; }
    .btn-emergency { background: rgba(239, 68, 68, 0.15); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

    /* Bandwidth Toggle */
    .bandwidth-bar { display: flex; gap: 0.5rem; }
    .bandwidth-btn { flex: 1; padding: 0.5rem; font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--surface-elevated); }
    .bandwidth-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Diary Spatial Columns */
    .grid-view { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 768px) { .grid-view { grid-template-columns: repeat(3, 1fr); } }

    .column { background: var(--surface); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; min-height: 250px; }
    .column-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* Cards */
    .action-card {
      background: var(--surface-elevated); border-radius: 8px; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem; border-left: 4px solid var(--accent);
    }
    .action-card.hard-anchor { border-left-color: var(--accent-hard); background: #221E18; }
    .action-title { font-size: 0.95rem; line-height: 1.4; }
    .metadata-line { display: flex; gap: 0.4rem; font-size: 0.75rem; color: var(--text-muted); align-items: center; flex-wrap: wrap; }
    .badge { background: var(--bg); padding: 0.2rem 0.45rem; border-radius: 4px; border: 1px solid var(--surface-elevated); }

    /* Capture Dock */
    .capture-dock {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      width: calc(100% - 2rem); max-width: 800px; background: var(--surface);
      border: 1px solid var(--surface-elevated); border-radius: var(--radius);
      padding: 0.5rem; display: flex; gap: 0.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .capture-input { flex: 1; background: transparent; border: none; padding: 0.5rem; color: var(--text); font-size: 0.95rem; outline: none; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Anchor OS</h1>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn-emergency" onclick="App.triggerEmergencyReset()">🆘 Reset</button>
      <button onclick="App.openConfigModal()">⚙️</button>
    </div>
  </header>

  <!-- Mid-Day Dynamic Bandwidth Bar -->
  <div class="bandwidth-bar">
    <button id="bw-full" class="bandwidth-btn active" onclick="App.setBandwidth('Full Day')">⚡ Full Day</button>
    <button id="bw-squeezed" class="bandwidth-btn" onclick="App.setBandwidth('Squeezed')">⏳ Squeezed</button>
    <button id="bw-low" class="bandwidth-btn" onclick="App.setBandwidth('Low Bandwidth')">🔋 Low</button>
  </div>

  <main class="grid-view">
    <section class="column">
      <div class="column-header"><span>Work</span><span id="count-work">0/2</span></div>
      <div id="cards-work" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </section>

    <section class="column">
      <div class="column-header"><span>Personal Growth</span><span id="count-growth">0/1</span></div>
      <div id="cards-growth" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </section>

    <section class="column">
      <div class="column-header"><span>Health</span><span id="count-health">0/1</span></div>
      <div id="cards-health" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
    </section>
  </main>

  <div class="capture-dock">
    <button id="btn-mic" onclick="App.toggleSpeech()">🎙️</button>
    <input type="text" id="raw-input" class="capture-input" placeholder="Ambient dump... (e.g. gym, file taxes tomorrow)" onkeydown="if(event.key==='Enter') App.processAmbientDump()">
    <button class="btn-accent" onclick="App.processAmbientDump()">Parse</button>
  </div>
</div>

<script>
/**
 * HYBRID STORAGE ENGINE:
 * Local IndexedDB for instant UI launches + Background Supabase Sync for cross-device state.
 */
class HybridDB {
  constructor() {
    this.idb = null;
    this.url = localStorage.getItem("SB_URL") || "";
    this.key = localStorage.getItem("SB_KEY") || "";
  }

  async init() {
    return new Promise((resolve) => {
      const req = indexedDB.open("AnchorLocal", 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("store")) db.createObjectStore("store", { keyPath: "key" });
      };
      req.onsuccess = (e) => {
        this.idb = e.target.result;
        resolve();
      };
    });
  }

  async get(key) {
    // 1. Instant local read
    const localVal = await new Promise((res) => {
      const tx = this.idb.transaction("store", "readonly");
      const req = tx.objectStore("store").get(key);
      req.onsuccess = () => res(req.result ? req.result.value : null);
      req.onerror = () => res(null);
    });

    // 2. Refresh from cloud if configured
    if (this.url && this.key) {
      try {
        const resp = await fetch(`${this.url}/rest/v1/anchor_store?key=eq.${encodeURIComponent(key)}`, {
          headers: { 'apikey': this.key, 'Authorization': `Bearer ${this.key}` }
        });
        const cloudData = await resp.json();
        if (cloudData && cloudData.length > 0) {
          await this.putLocal(key, cloudData[0].value);
          return cloudData[0].value;
        }
      } catch (e) {
        console.warn("Cloud read failed; using local fallback:", e);
      }
    }
    return localVal;
  }

  async putLocal(key, value) {
    return new Promise((res) => {
      const tx = this.idb.transaction("store", "readwrite");
      tx.objectStore("store").put({ key, value });
      tx.oncomplete = () => res();
    });
  }

  async set(key, value) {
    await this.putLocal(key, value);
    if (!this.url || !this.key) return;

    try {
      await fetch(`${this.url}/rest/v1/anchor_store`, {
        method: 'POST',
        headers: {
          'apikey': this.key,
          'Authorization': `Bearer ${this.key}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
      });
    } catch (e) {
      console.warn("Cloud write failed; queued locally:", e);
    }
  }

  async getAllActions() {
    const actions = (await this.get("actions_list")) || [];
    return actions;
  }

  async saveAllActions(actions) {
    await this.set("actions_list", actions);
  }
}

/**
 * APP CONTROLLER
 */
class Controller {
  constructor() {
    this.db = new HybridDB();
    this.geminiKey = localStorage.getItem("GEMINI_KEY") || "";
    this.recognition = null;
  }

  async start() {
    await this.db.init();
    if ("storage" in navigator && "persist" in navigator.storage) {
      await navigator.storage.persist();
    }
    this.bindEvents();
    await this.verifyMidnightReset();
    await this.render();
  }

  bindEvents() {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        this.verifyMidnightReset();
        this.render();
      }
    });
  }

  async verifyMidnightReset() {
    const today = new Date().toISOString().split("T")[0];
    const lastSession = await this.db.get("last_session_date");
    if (lastSession !== today) {
      await this.db.set("last_session_date", today);
      await this.setBandwidth("Full Day");
    }
  }

  async setBandwidth(mode) {
    await this.db.set("daily_bandwidth", mode);
    ["full", "squeezed", "low"].forEach(id => {
      const btn = document.getElementById(`bw-${id}`);
      if (btn) btn.classList.remove("active");
    });
    if (mode === "Full Day") document.getElementById("bw-full")?.classList.add("active");
    if (mode === "Squeezed") document.getElementById("bw-squeezed")?.classList.add("active");
    if (mode === "Low Bandwidth") document.getElementById("bw-low")?.classList.add("active");
    await this.render();
  }

  openConfigModal() {
    const gemini = prompt("Google AI Studio API Key:", this.geminiKey);
    if (gemini !== null) {
      this.geminiKey = gemini.trim();
      localStorage.setItem("GEMINI_KEY", this.geminiKey);
    }

    const sbUrl = prompt("Supabase Project URL (e.g. https://xyz.supabase.co):", this.db.url);
    if (sbUrl !== null) {
      this.db.url = sbUrl.trim();
      localStorage.setItem("SB_URL", this.db.url);
    }

    const sbKey = prompt("Supabase Anon Key:", this.db.key);
    if (sbKey !== null) {
      this.db.key = sbKey.trim();
      localStorage.setItem("SB_KEY", this.db.key);
    }
    this.render();
  }

  toggleSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Speech recognition not supported on this browser.");

    if (this.recognition) {
      this.recognition.stop();
      this.recognition = null;
      document.getElementById("btn-mic").innerText = "🎙️";
      return;
    }

    this.recognition = new SpeechRecognition();
    this.recognition.onstart = () => { document.getElementById("btn-mic").innerText = "🛑"; };
    this.recognition.onresult = (e) => {
      document.getElementById("raw-input").value = e.results[0][0].transcript;
      this.processAmbientDump();
    };
    this.recognition.onerror = () => { this.recognition = null; document.getElementById("btn-mic").innerText = "🎙️"; };
    this.recognition.onend = () => { this.recognition = null; document.getElementById("btn-mic").innerText = "🎙️"; };
    this.recognition.start();
  }

 async processAmbientDump() {
    const field = document.getElementById("raw-input");
    const text = field.value.trim();
    if (!text) return;

    if (!this.geminiKey) {
      this.openConfigModal();
      if (!this.geminiKey) return;
    }

    field.value = "Parsing intent...";
    field.disabled = true;

    try {
      const todayStr = new Date().toISOString().split("T")[0];
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${this.geminiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Today is ${todayStr}. Deconstruct this ADHD brain dump into physical action items: "${text}"`
            }]
          }],
          generationConfig: {
            response_mime_type: "application/json",
            response_schema: {
              type: "OBJECT",
              properties: {
                parsed_actions: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      title: { "type": "STRING" },
                      domain: { "type": "STRING", "enum": ["Work", "Personal Growth", "Health"] },
                      batch_type: { "type": "STRING", "enum": ["None", "Calls & Messages", "Quick Admin", "Errands & Shopping"] },
                      estimated_mins: { "type": "INTEGER" },
                      is_hard_deadline: { "type": "BOOLEAN" },
                      due_date: { "type": "STRING" }
                    },
                    required: ["title", "domain", "batch_type", "estimated_mins", "is_hard_deadline"]
                  }
                }
              },
              required: ["parsed_actions"]
            }
          }
        })
      });

      const json = await res.json();
      
      // If Google returned an API error, show the exact message
      if (json.error) {
        throw new Error(json.error.message || JSON.stringify(json.error));
      }

      if (!json.candidates || !json.candidates[0]?.content?.parts?.[0]?.text) {
        throw new Error("Gemini returned an empty candidate list. Try rephrasing.");
      }

      const payload = JSON.parse(json.candidates[0].content.parts[0].text);

      const existingActions = await this.db.getAllActions();
      for (const item of payload.parsed_actions) {
        existingActions.push({
          id: "act_" + crypto.randomUUID(),
          title: item.title,
          domain: item.domain,
          batch_type: item.batch_type,
          estimated_mins: item.estimated_mins || 10,
          is_hard_deadline: !!item.is_hard_deadline,
          due_date: item.due_date || null,
          is_completed: false,
          defer_count: 0
        });
      }

      await this.db.saveAllActions(existingActions);
      field.value = "";
    } catch (err) {
      alert("Extraction error: " + err.message);
      field.value = text;
    } finally {
      field.disabled = false;
      await this.render();
    }
  }

  async completeAction(id) {
    const actions = await this.db.getAllActions();
    const action = actions.find(a => a.id === id);
    if (action) {
      action.is_completed = true;
      await this.db.saveAllActions(actions);
      await this.render();
    }
  }

async shrinkStep(id) {
    if (!this.geminiKey) { this.openConfigModal(); return; }
    const actions = await this.db.getAllActions();
    const action = actions.find(a => a.id === id);
    if (!action) return;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${this.geminiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `Make this task an absurdly simple, immediate 2-minute starter action: "${action.title}"`
            }]
          }],
          generationConfig: {
            response_mime_type: "application/json",
            response_schema: {
              type: "OBJECT",
              properties: { "micro_step": { "type": "STRING" } },
              required: ["micro_step"]
            }
          }
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      
      const output = JSON.parse(data.candidates[0].content.parts[0].text);
      action.title = output.micro_step;
      action.estimated_mins = 2;
      await this.db.saveAllActions(actions);
      await this.render();
    } catch (e) {
      alert("Failed to slice: " + e.message);
    }
  }

  async triggerEmergencyReset() {
    const actions = await this.db.getAllActions();
    actions.forEach(a => {
      if (!a.is_completed) a.defer_count = (a.defer_count || 0) + 1;
    });
    await this.db.saveAllActions(actions);
    await this.setBandwidth("Low Bandwidth");
  }

  async render() {
    const actions = await this.db.getAllActions();
    const bandwidth = (await this.db.get("daily_bandwidth")) || "Full Day";
    const todayStr = new Date().toISOString().split("T")[0];

    // Highlight active bandwidth tab
    ["full", "squeezed", "low"].forEach(id => document.getElementById(`bw-${id}`)?.classList.remove("active"));
    if (bandwidth === "Full Day") document.getElementById("bw-full")?.classList.add("active");
    if (bandwidth === "Squeezed") document.getElementById("bw-squeezed")?.classList.add("active");
    if (bandwidth === "Low Bandwidth") document.getElementById("bw-low")?.classList.add("active");

    const incomplete = actions.filter(a => !a.is_completed);

    // Hard Deadlines seize priority
    const hardAnchors = incomplete.filter(a => a.is_hard_deadline && a.due_date && a.due_date <= todayStr);
    const standardActions = incomplete.filter(a => !hardAnchors.includes(a));

    // Dynamic slot caps based on mid-day energy
    let limits = { "Work": 2, "Personal Growth": 1, "Health": 1 };
    if (bandwidth === "Squeezed") limits = { "Work": 1, "Personal Growth": 0, "Health": 1 };
    if (bandwidth === "Low Bandwidth") limits = { "Work": 1, "Personal Growth": 0, "Health": 0 };

    const domains = [
      { name: "Work", el: "cards-work", countEl: "count-work" },
      { name: "Personal Growth", el: "cards-growth", countEl: "count-growth" },
      { name: "Health", el: "cards-health", countEl: "count-health" }
    ];

    domains.forEach(d => {
      const container = document.getElementById(d.el);
      const counter = document.getElementById(d.countEl);
      container.innerHTML = "";

      const domainHard = hardAnchors.filter(a => a.domain === d.name);
      const domainStd = standardActions.filter(a => a.domain === d.name);

      // Hard anchors always sit in Slot 1
      const prioritized = [...domainHard, ...domainStd];
      const maxSlots = limits[d.name];
      const visible = prioritized.slice(0, maxSlots);

      counter.innerText = `${visible.length}/${maxSlots}`;

      visible.forEach(act => {
        const isHard = act.is_hard_deadline && act.due_date && act.due_date <= todayStr;
        const buffered = Math.round(act.estimated_mins * 1.5);
        const card = document.createElement("div");
        card.className = `action-card ${isHard ? 'hard-anchor' : ''}`;
        card.innerHTML = `
          <div class="action-title">${isHard ? '⚓ <strong>[Hard Deadline]</strong> ' : ''}${act.title}</div>
          <div class="metadata-line">
            <span class="badge">⏱️ ${act.estimated_mins}m (Buf: ${buffered}m)</span>
            ${act.batch_type !== "None" ? `<span class="badge">🏷️ ${act.batch_type}</span>` : ""}
            ${isHard ? `<span class="badge" style="color:var(--accent-hard)">Target Today</span>` : ""}
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button class="btn-accent" style="flex:1;" onclick="App.completeAction('${act.id}')">✓ Done</button>
            <button style="padding: 0.5rem;" title="Micro-slice" onclick="App.shrinkStep('${act.id}')">✂️</button>
          </div>
        `;
        container.appendChild(card);
      });
    });
  }
}

const App = new Controller();
window.addEventListener("DOMContentLoaded", () => App.start());
</script>
</body>
</html>
